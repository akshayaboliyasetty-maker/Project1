<!DOCTYPE html>
<html>
<head>
    <title>Food Recipe App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
            background: #fff7ed;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #ff7043;
            color: white;
        }

        button {
            background: #ff7043;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .page {
            display: none;
            padding: 30px;
        }

        .active {
            display: block;
        }

        .box {
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .box button {
            width: 100%;
            margin-top: 10px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 45px;
            color: #e64a19;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }

        .card h3 {
            color: #e64a19;
        }

        .admin-form {
            max-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <h2>🍴 Food Recipe App</h2>
    <div>
        <button onclick="showPage('home')">Home</button>
        <button onclick="showPage('login')">Login</button>
        <button onclick="showPage('signup')">Signup</button>
    </div>
</nav>


<!-- HOME -->
<div id="home" class="page active">
    <div class="hero">
        <h1>🍲 Delicious Food Recipes</h1>
        <p>Discover simple and tasty recipes</p>
        <button onclick="showPage('login')">Get Started</button>
    </div>
</div>


<!-- SIGNUP -->
<div id="signup" class="page">

    <div class="box">

        <h2>Create Account</h2>

        <input id="sname" placeholder="Name">

        <input id="semail" placeholder="Email">

        <input id="spassword" type="password" placeholder="Password">

        <select id="srole">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>

        <button onclick="signup()">Signup</button>

        <p>Already have account?
            <a href="#" onclick="showPage('login')">Login</a>
        </p>

    </div>

</div>


<!-- LOGIN -->
<div id="login" class="page">

    <div class="box">

        <h2>Login</h2>

        <input id="lemail" placeholder="Email">

        <input id="lpassword" type="password" placeholder="Password">

        <button onclick="login()">Login</button>

        <p>New user?
            <a href="#" onclick="showPage('signup')">Signup</a>
        </p>

    </div>

</div>


<!-- USER MODULE -->
<div id="user" class="page">

    <h1>👤 User Dashboard</h1>

    <button onclick="logout()">Logout</button>

    <h2>Search Recipes</h2>

    <input
        id="search"
        placeholder="Search recipe..."
        onkeyup="displayRecipes()"
    >

    <div id="recipeList" class="grid"></div>

</div>


<!-- ADMIN MODULE -->
<div id="admin" class="page">

    <h1>👨‍💼 Admin Dashboard</h1>

    <button onclick="logout()">Logout</button>

    <h2>Add Recipe</h2>

    <div class="admin-form">

        <input id="rname" placeholder="Recipe Name">

        <input id="rcategory" placeholder="Category">

        <input id="ringredients" placeholder="Ingredients">

        <input id="rinstructions" placeholder="Instructions">

        <button onclick="addRecipe()">Add Recipe</button>

    </div>

    <h2>Manage Recipes</h2>

    <div id="adminList" class="grid"></div>

</div>


<script>

    /* PAGE NAVIGATION */

    function showPage(page) {

        document.querySelectorAll(".page").forEach(function(p) {
            p.classList.remove("active");
        });

        document.getElementById(page).classList.add("active");

        if (page === "user") {
            displayRecipes();
        }

        if (page === "admin") {
            displayAdminRecipes();
        }
    }


    /* SIGNUP */

    function signup() {

        let user = {

            name: document.getElementById("sname").value,

            email: document.getElementById("semail").value,

            password: document.getElementById("spassword").value,

            role: document.getElementById("srole").value

        };

        if (!user.name || !user.email || !user.password) {

            alert("Please fill all fields");

            return;
        }

        localStorage.setItem("user", JSON.stringify(user));

        alert("Signup Successful!");

        showPage("login");
    }


    /* LOGIN */

    function login() {

        let user = JSON.parse(localStorage.getItem("user"));

        if (!user) {

            alert("Please signup first");

            showPage("signup");

            return;
        }

        let email = document.getElementById("lemail").value;

        let password = document.getElementById("lpassword").value;


        if (email === user.email && password === user.password) {

            localStorage.setItem("loggedIn", "true");

            if (user.role === "admin") {

                showPage("admin");

            } else {

                showPage("user");

            }

        } else {

            alert("Invalid Email or Password");

        }
    }


    /* DEFAULT RECIPES */

    let recipes = JSON.parse(localStorage.getItem("recipes")) || [

        {
            name: "Chicken Biryani",
            category: "Lunch",
            ingredients: "Rice, Chicken, Spices",
            instructions: "Cook rice and chicken with spices."
        },

        {
            name: "Pizza",
            category: "Dinner",
            ingredients: "Base, Cheese, Tomato",
            instructions: "Add toppings and bake."
        },

        {
            name: "Pasta",
            category: "Dinner",
            ingredients: "Pasta, Sauce, Vegetables",
            instructions: "Boil pasta and mix with sauce."
        }

    ];


    localStorage.setItem("recipes", JSON.stringify(recipes));


    /* USER RECIPES */

    function displayRecipes() {

        let search =
            document.getElementById("search").value.toLowerCase();

        let list = document.getElementById("recipeList");

        let result = recipes.filter(function(recipe) {

            return recipe.name.toLowerCase().includes(search);

        });


        list.innerHTML = "";


        result.forEach(function(recipe) {

            list.innerHTML += `

                <div class="card">

                    <h3>🍴 ${recipe.name}</h3>

                    <p>
                        <b>Category:</b>
                        ${recipe.category}
                    </p>

                    <p>
                        <b>Ingredients:</b>
                        ${recipe.ingredients}
                    </p>

                    <p>
                        <b>Instructions:</b>
                        ${recipe.instructions}
                    </p>

                </div>

            `;

        });

    }


    /* ADD RECIPE */

    function addRecipe() {

        let recipe = {

            name: document.getElementById("rname").value,

            category: document.getElementById("rcategory").value,

            ingredients:
                document.getElementById("ringredients").value,

            instructions:
                document.getElementById("rinstructions").value

        };


        if (!recipe.name ||
            !recipe.category ||
            !recipe.ingredients ||
            !recipe.instructions) {

            alert("Please fill all fields");

            return;
        }


        recipes.push(recipe);

        localStorage.setItem(
            "recipes",
            JSON.stringify(recipes)
        );


        alert("Recipe Added Successfully!");


        document.getElementById("rname").value = "";
        document.getElementById("rcategory").value = "";
        document.getElementById("ringredients").value = "";
        document.getElementById("rinstructions").value = "";


        displayAdminRecipes();

    }


    /* ADMIN RECIPES */

    function displayAdminRecipes() {

        let list = document.getElementById("adminList");

        list.innerHTML = "";


        recipes.forEach(function(recipe, index) {

            list.innerHTML += `

                <div class="card">

                    <h3>${recipe.name}</h3>

                    <p>${recipe.category}</p>

                    <button onclick="deleteRecipe(${index})">
                        Delete
                    </button>

                </div>

            `;

        });

    }


    /* DELETE */

    function deleteRecipe(index) {

        recipes.splice(index, 1);

        localStorage.setItem(
            "recipes",
            JSON.stringify(recipes)
        );

        displayAdminRecipes();

        alert("Recipe Deleted");

    }


    /* LOGOUT */

    function logout() {

        localStorage.removeItem("loggedIn");

        showPage("home");

    }

</script>

</body>
</html>
