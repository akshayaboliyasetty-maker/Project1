<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - FlavourNest</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


<nav class="navbar">

    <div class="logo">
        🍴 Flavour<span>Nest</span>
    </div>


    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="user.html">
            My Favourites
        </a>

        <button
            class="login-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>


<section class="section">

    <div class="section-heading">

        <p>
            USER MODULE
        </p>

        <h2 id="welcome">
            Welcome!
        </h2>

        <span>
            Your favourite recipes ❤️
        </span>

    </div>


    <div class="dash-box">

        <h2>
            ❤️ My Favourite Recipes
        </h2>

        <div
            id="favouriteList"
            style="margin-top:20px"
        >
        </div>

    </div>

</section>


<script>

/* GET USER */

let currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );


if (currentUser) {

    document.getElementById(
        "welcome"
    ).innerText =
        "Welcome, " +
        currentUser.name +
        "!";

}


/* GET FAVOURITES */

let favourites =
    JSON.parse(
        localStorage.getItem("favourites")
    ) || [];


let list =
    document.getElementById(
        "favouriteList"
    );


if (favourites.length === 0) {

    list.innerHTML = `
        <p style="color:#81766e">
            No favourite recipes yet.
            Go back to Home and click ♡
            on a recipe.
        </p>
    `;

}

else {

    favourites.forEach(
        function(recipe, index) {

            let item =
                document.createElement("div");

            item.style.padding = "15px";

            item.style.borderBottom =
                "1px solid #eee";

            item.style.display =
                "flex";

            item.style.justifyContent =
                "space-between";

            item.innerHTML = `

                <b>
                    🍴 ${recipe}
                </b>

                <button
                    onclick="removeFavourite(${index})"
                    style="
                    border:none;
                    background:#fff0e5;
                    color:#e85d04;
                    padding:8px 12px;
                    border-radius:8px;
                    cursor:pointer;
                    "
                >
                    Remove
                </button>

            `;

            list.appendChild(item);

        }
    );

}


/* REMOVE */

function removeFavourite(index) {

    favourites.splice(index, 1);

    localStorage.setItem(
        "favourites",
        JSON.stringify(favourites)
    );

    location.reload();

}


/* LOGOUT */

function logout() {

    localStorage.removeItem(
        "currentUser"
    );

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
